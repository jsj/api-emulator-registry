name: Captured API parity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/parity/*.test.mjs
      - run: node scripts/parity.mjs robinhood-trading
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: .emu/parity/*.json
